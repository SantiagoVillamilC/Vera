# Publica un GitHub Release con el APK firmado. Se dispara al empujar un tag
# vX.Y.Z y solo acepta tags cuyo commit ya esté en main. La keystore vive en
# los secrets del repositorio; el respaldo está en la VPS (/opt/centinela/secrets/android).
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must be reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: Build signed APK and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      API_BASE_URL: https://veraapp.tech
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/vera-release.jks
          {
            echo "storeFile=app/vera-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > android/key.properties

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name="${TAG_NAME#v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "vera-${TAG_NAME}.apk"

      - name: Verify signature is not debug
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "vera-${TAG_NAME}.apk" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then
            echo "El APK quedó firmado con la clave debug" >&2
            exit 1
          fi
          sha256sum "vera-${TAG_NAME}.apk" > "vera-${TAG_NAME}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            "vera-${TAG_NAME}.apk" "vera-${TAG_NAME}.apk.sha256" \
            --title "Vera ${TAG_NAME}" \
            --generate-notes \
            --verify-tag
