# Publica un GitHub Release con el APK firmado. Dos disparadores, un solo
# camino de construcción y firma:
#   - push de un tag vX.Y.Z, para publicar un tag que ya existe.
#   - workflow_dispatch con la versión como entrada, que crea el tag en el
#     commit de main desde el que se despacha. Es la vía normal: la versión se
#     decide a mano y la mecánica queda automatizada.
# En ambos casos el commit debe estar contenido en main. La keystore vive en
# los secrets del repositorio; el respaldo está en la VPS (/opt/centinela/secrets/android).
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, sin la v (ejemplo 1.0.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: La versión despachada debe ser semver
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "La versión \"$VERSION\" no tiene la forma X.Y.Z." >&2
            exit 1
          fi

      - name: El commit debe estar contenido en main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: Build signed APK and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
      API_BASE_URL: https://veraapp.tech
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/vera-release.jks
          {
            echo "storeFile=app/vera-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > android/key.properties

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name="${TAG_NAME#v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "vera-${TAG_NAME}.apk"

      - name: Verify signature is not debug
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "vera-${TAG_NAME}.apk" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then
            echo "El APK quedó firmado con la clave debug" >&2
            exit 1
          fi
          sha256sum "vera-${TAG_NAME}.apk" > "vera-${TAG_NAME}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # El tag no existe todavía: lo crea gh release create en el commit
            # desde el que se despachó, que el paso anterior ya confirmó que
            # está contenido en main.
            gh release create "$TAG_NAME" \
              "vera-${TAG_NAME}.apk" "vera-${TAG_NAME}.apk.sha256" \
              --title "Vera ${TAG_NAME}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG_NAME" \
              "vera-${TAG_NAME}.apk" "vera-${TAG_NAME}.apk.sha256" \
              --title "Vera ${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  ios:
    name: Build unsigned IPA and attach to release
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
      API_BASE_URL: https://veraapp.tech
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${TAG_NAME#v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry "vera-${TAG_NAME}-sin-firmar.ipa" Payload
          shasum -a 256 "vera-${TAG_NAME}-sin-firmar.ipa" > "vera-${TAG_NAME}-sin-firmar.ipa.sha256"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG_NAME" \
            "vera-${TAG_NAME}-sin-firmar.ipa" "vera-${TAG_NAME}-sin-firmar.ipa.sha256"
